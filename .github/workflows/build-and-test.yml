name: "Build & Test Drift JVM Backend"
on: pull_request

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout drift-jvm
        uses: actions/checkout@v4
        with:
          path: drift-jvm

      - name: Checkout drift
        uses: actions/checkout@v4
        with:
          repository: drift-language/drift
          path: drift

      - name: Align drift branch
        working-directory: drift
        env:
          BR: ${{ github.head_ref }}
        run: |
          REF="$(tr -d '[:space:]' < ../drift-jvm/.gitrefbranch--drift 2>/dev/null)"
          REF="${REF:-$BR}"
          if git fetch --depth 1 origin "$REF" 2>/dev/null; then
            git checkout --detach FETCH_HEAD
            echo "drift: $REF ($(git rev-parse --short HEAD))"
          else
            echo "drift: branche par défaut ($(git rev-parse --short HEAD))"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build
        working-directory: drift-jvm
        run: ./gradlew build