name: "Build & Test Drift JVM Backend"
on: pull_request

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout drift-jvm
        uses: actions/checkout@v4
        with:
          path: drift-jvm

      - name: Checkout drift
        uses: actions/checkout@v4
        with:
          repository: drift-language/drift
          path: drift

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build
        working-directory: drift-jvm
        run: ./gradlew build